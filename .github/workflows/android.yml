name: Android CI

# Pull requests and main only: private repo with a minutes quota (ADR section 10).
on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      # The same toolchain script as a local build (README, Building), so CI proves it works on a clean machine.
      - uses: actions/cache@v4
        with:
          path: ~/.cache/android-toolchain
          key: android-toolchain-${{ hashFiles('scripts/setup-toolchain.sh') }}
      - name: Toolchain
        run: |
          scripts/setup-toolchain.sh
          scripts/setup-toolchain.sh --print-env | sed -e 's/^export //' -e 's/"//g' | grep -v '^PATH=' >> "$GITHUB_ENV"
          # The runner image sets ANDROID_SDK_ROOT to its own SDK; the Android Gradle plugin refuses two locations.
          echo "ANDROID_SDK_ROOT=$HOME/.cache/android-toolchain/sdk" >> "$GITHUB_ENV"
          echo "$HOME/.cache/android-toolchain/jdk-17/bin" >> "$GITHUB_PATH"

      - uses: gradle/actions/setup-gradle@v4

      - name: Lint, unit tests, debug APK
        run: ./gradlew --no-daemon lint testDebugUnitTest assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: saypiper-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: screenshots
          path: app/build/outputs/roborazzi/*.png
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: showcase
          path: app/build/outputs/showcase/*.png
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: ${{ failure() }}
        with:
          name: reports
          path: |
            app/build/reports/
            app/build/test-results/
