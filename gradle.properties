# Keep Gradle at 2 GB and compile Kotlin inside it, so a build fits on a machine with little memory.
org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
kotlin.compiler.execution.strategy=in-process
android.useAndroidX=true
kotlin.code.style=official
# Unit tests write screenshots to app/build/outputs/roborazzi; nothing is compared yet.
roborazzi.test.record=true
